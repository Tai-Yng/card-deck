<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="玻璃拟态风格的算法题复习卡片，数据存放在 GitHub，随时随地同步学习。">
  <title>题卡集 · 算法题复习卡片</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="题卡集">
  <meta name="theme-color" content="#eaf1ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1220" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>

  <div class="wrap">
    <header class="topbar glass">
      <div class="brand"><img class="logo" src="icon.svg" alt="">题卡集</div>
      <div class="search"><input id="search" type="text" placeholder="搜索题目 / 正文 / 代码 / 标签…" aria-label="搜索卡片"></div>
      <div class="actions">
        <button id="btn-add" class="btn primary" type="button">＋ 添加卡片</button>
        <button id="btn-sync" class="btn" type="button" title="拉取并推送（按更新时间自动合并）"><span class="sicon">⟳</span> 同步 <i id="sync-dot" title="有未上传的修改"></i></button>
        <button id="btn-settings" class="btn" type="button" title="GitHub 同步设置" aria-label="设置">⚙</button>
      </div>
    </header>

    <nav class="filters glass" aria-label="标签筛选">
      <div class="chips" id="filters"></div>
      <span class="count" id="count"></span>
    </nav>

    <main id="grid" class="grid" aria-live="polite"></main>

    <footer class="foot">
      数据保存在你的 GitHub 仓库 · 可安装到手机 / 桌面（PWA）离线使用
    </footer>
  </div>

  <noscript><p style="text-align:center;padding:40px">本应用需要启用 JavaScript。</p></noscript>

  <!-- 添加 / 编辑卡片 -->
  <div class="modal" id="modal-add" role="dialog" aria-modal="true" aria-labelledby="modal-add-title">
    <div class="sheet glass">
      <h3 id="modal-add-title">添加卡片</h3>
      <form id="form-add">
        <div class="field">
          <label for="f-title">题目 *</label>
          <input id="f-title" type="text" placeholder="例如：1. 两数之和" maxlength="120">
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-diff">难度</label>
            <select id="f-diff">
              <option value="">不标注</option>
              <option value="简单">简单</option>
              <option value="中等">中等</option>
              <option value="困难">困难</option>
            </select>
          </div>
          <div class="field">
            <label for="f-lang">代码语言</label>
            <select id="f-lang">
              <option value="cpp">C++</option>
              <option value="python">Python</option>
              <option value="java">Java</option>
              <option value="javascript">JavaScript</option>
              <option value="go">Go</option>
              <option value="c">C</option>
              <option value="plain">纯文本</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-tags">标签（用逗号分隔）</label>
          <input id="f-tags" type="text" placeholder="例如：哈希表, 数组">
        </div>
        <div class="field">
          <label for="f-body">正文（题目描述 / 思路 / 笔记）</label>
          <textarea id="f-body" rows="5" placeholder="题目描述、解题思路、易错点…"></textarea>
        </div>
        <div class="field">
          <label for="f-code">代码</label>
          <textarea id="f-code" class="mono" rows="9" spellcheck="false" placeholder="粘贴你的题解代码…"></textarea>
        </div>
        <div class="sheet-actions">
          <button class="btn" type="button" data-close>取消</button>
          <button class="btn primary" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 同步设置 -->
  <div class="modal" id="modal-settings" role="dialog" aria-modal="true" aria-labelledby="modal-set-title">
    <div class="sheet glass">
      <h3 id="modal-set-title">GitHub 同步设置</h3>
      <form id="form-settings">
        <div class="row2">
          <div class="field"><label for="s-owner">用户名 / 组织 (owner)</label><input id="s-owner" type="text" placeholder="例如：octocat" autocomplete="off"></div>
          <div class="field"><label for="s-repo">仓库名 (repo)</label><input id="s-repo" type="text" placeholder="例如：my-cards" autocomplete="off"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="s-branch">分支</label><input id="s-branch" type="text" placeholder="main"></div>
          <div class="field"><label for="s-path">数据文件路径</label><input id="s-path" type="text" placeholder="data/cards.json"></div>
        </div>
        <div class="field">
          <label for="s-token">Personal Access Token（用于上传；只拉取可留空）</label>
          <input id="s-token" type="password" placeholder="github_pat_… / ghp_…" autocomplete="off">
          <p class="hint">Token 只保存在本机浏览器中。建议创建 <b>Fine-grained Token</b>：仅授权本仓库、仅给 Contents 读写权限。入口：GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens</p>
        </div>
        <div class="sheet-actions">
          <button class="btn" type="button" id="btn-clear">清除本机缓存</button>
          <button class="btn" type="button" id="btn-export">导出 JSON</button>
          <button class="btn" type="button" id="btn-test">测试连接</button>
          <button class="btn primary" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script src="js/highlight.js"></script>
  <script src="js/github.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
